name: Product Completion Verification
on:
  pull_request:
  push:
    branches: ["ai/product-completion/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: npm install --no-audit --no-fund
      - run: npm run test:regression
      - run: npm run build
